components:
  schemas:
    ChatCompletionFunctionCallOption:
      description: |
        Specifying a particular function via `{"name": "my_function"}` forces the model to call that function.
      properties:
        name:
          description: The name of the function to call.
          type: string
      required:
        - name
      type: object
    ChatCompletionFunctions:
      deprecated: true
      properties:
        description:
          description: >-
            A description of what the function does, used by the model to choose when and how to call the
            function.
          type: string
        name:
          description: >-
            The name of the function to be called. Must be a-z, A-Z, 0-9, or contain underscores and dashes,
            with a maximum length of 64.
          type: string
        parameters:
          $ref: '#/components/schemas/FunctionParameters'
      required:
        - name
      type: object
    ChatCompletionMessageToolCall:
      properties:
        function:
          description: The function that the model called.
          properties:
            arguments:
              description: >-
                The arguments to call the function with, as generated by the model in JSON format. Note that
                the model does not always generate valid JSON, and may hallucinate parameters not defined by
                your function schema. Validate the arguments in your code before calling your function.
              type: string
            name:
              description: The name of the function to call.
              type: string
          required:
            - name
            - arguments
          type: object
        id:
          description: The ID of the tool call.
          type: string
        type:
          description: The type of the tool. Currently, only `function` is supported.
          enum:
            - function
          type: string
      required:
        - id
        - type
        - function
      type: object
    ChatCompletionMessageToolCallChunk:
      properties:
        function:
          properties:
            arguments:
              description: >-
                The arguments to call the function with, as generated by the model in JSON format. Note that
                the model does not always generate valid JSON, and may hallucinate parameters not defined by
                your function schema. Validate the arguments in your code before calling your function.
              type: string
            name:
              description: The name of the function to call.
              type: string
          type: object
        id:
          description: The ID of the tool call.
          type: string
        index:
          type: integer
        type:
          description: The type of the tool. Currently, only `function` is supported.
          enum:
            - function
          type: string
      required:
        - index
      type: object
    ChatCompletionMessageToolCalls:
      description: The tool calls generated by the model, such as function calls.
      items:
        $ref: '#/components/schemas/ChatCompletionMessageToolCall'
      type: array
    ChatCompletionNamedToolChoice:
      description: Specifies a tool the model should use. Use to force the model to call a specific function.
      properties:
        function:
          properties:
            name:
              description: The name of the function to call.
              type: string
          required:
            - name
          type: object
        type:
          description: The type of the tool. Currently, only `function` is supported.
          enum:
            - function
          type: string
      required:
        - type
        - function
      type: object
    ChatCompletionRequestAssistantMessage:
      additionalProperties: false
      properties:
        content:
          description: >
            The contents of the assistant message. Required unless `tool_calls` or `function_call` is
            specified.
          nullable: true
          type: string
        function_call:
          deprecated: true
          description: >-
            Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be
            called, as generated by the model.
          properties:
            arguments:
              description: >-
                The arguments to call the function with, as generated by the model in JSON format. Note that
                the model does not always generate valid JSON, and may hallucinate parameters not defined by
                your function schema. Validate the arguments in your code before calling your function.
              type: string
            name:
              description: The name of the function to call.
              type: string
          type: object
        name:
          description: >-
            An optional name for the participant. Provides the model information to differentiate between
            participants of the same role.
          type: string
        role:
          description: The role of the messages author, in this case `assistant`.
          enum:
            - assistant
          type: string
        tool_calls:
          $ref: '#/components/schemas/ChatCompletionMessageToolCalls'
      required:
        - role
      title: Assistant message
      type: object
    ChatCompletionRequestFunctionMessage:
      additionalProperties: false
      deprecated: true
      properties:
        content:
          description: The contents of the function message.
          nullable: true
          type: string
        name:
          description: The name of the function to call.
          type: string
        role:
          description: The role of the messages author, in this case `function`.
          enum:
            - function
          type: string
      required:
        - role
        - content
        - name
      title: Function message
      type: object
    ChatCompletionRequestMessage:
      discriminator:
        mapping:
          assistant: '#/components/schemas/ChatCompletionRequestAssistantMessage'
          function: '#/components/schemas/ChatCompletionRequestFunctionMessage'
          system: '#/components/schemas/ChatCompletionRequestSystemMessage'
          tool: '#/components/schemas/ChatCompletionRequestToolMessage'
          user: '#/components/schemas/ChatCompletionRequestUserMessage'
        propertyName: role
      oneOf:
        - $ref: '#/components/schemas/ChatCompletionRequestSystemMessage'
        - $ref: '#/components/schemas/ChatCompletionRequestUserMessage'
        - $ref: '#/components/schemas/ChatCompletionRequestAssistantMessage'
        - $ref: '#/components/schemas/ChatCompletionRequestToolMessage'
        - $ref: '#/components/schemas/ChatCompletionRequestFunctionMessage'
    ChatCompletionRequestMessageContentPart:
      oneOf:
        - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartText'
        - $ref: '#/components/schemas/ChatCompletionRequestMessageContentPartImage'
    ChatCompletionRequestMessageContentPartImage:
      properties:
        image_url:
          properties:
            detail:
              default: auto
              description: Specifies the detail level of the image.
              enum:
                - auto
                - low
                - high
              type: string
            url:
              description: Either a URL of the image or the base64 encoded image data.
              format: uri
              type: string
          required:
            - url
          type: object
        type:
          description: The type of the content part.
          enum:
            - image_url
          type: string
      required:
        - type
        - image_url
      title: Image content part
      type: object
    ChatCompletionRequestMessageContentPartText:
      properties:
        text:
          description: The text content.
          type: string
        type:
          description: The type of the content part.
          enum:
            - text
          type: string
      required:
        - type
        - text
      title: Text content part
      type: object
    ChatCompletionRequestSystemMessage:
      additionalProperties: false
      properties:
        content:
          description: The contents of the system message.
          type: string
        name:
          description: >-
            An optional name for the participant. Provides the model information to differentiate between
            participants of the same role.
          type: string
        role:
          description: The role of the messages author, in this case `system`.
          enum:
            - system
          type: string
      required:
        - content
        - role
      title: System message
      type: object
    ChatCompletionRequestToolMessage:
      additionalProperties: false
      properties:
        content:
          description: The contents of the tool message.
          type: string
        role:
          description: The role of the messages author, in this case `tool`.
          enum:
            - tool
          type: string
        tool_call_id:
          description: Tool call that this message is responding to.
          type: string
      required:
        - role
        - content
        - tool_call_id
      title: Tool message
      type: object
    ChatCompletionRequestUserMessage:
      additionalProperties: false
      properties:
        content:
          description: |
            The contents of the user message.
          oneOf:
            - description: The text contents of the message.
              title: Text content
              type: string
            - description: >-
                An array of content parts with a defined type, each can be of type `text` or `image_url` when
                passing in images. You can pass multiple images by adding multiple `image_url` content parts.
                Image input is only supported when using the `gpt-4-visual-preview` model.
              items:
                $ref: '#/components/schemas/ChatCompletionRequestMessageContentPart'
              minItems: 1
              title: Array of content parts
              type: array
        name:
          description: >-
            An optional name for the participant. Provides the model information to differentiate between
            participants of the same role.
          type: string
        role:
          description: The role of the messages author, in this case `user`.
          enum:
            - user
          type: string
      required:
        - content
        - role
      title: User message
      type: object
    ChatCompletionResponseMessage:
      description: A chat completion message generated by the model.
      properties:
        content:
          description: The contents of the message.
          nullable: true
          type: string
        function_call:
          deprecated: true
          description: >-
            Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be
            called, as generated by the model.
          properties:
            arguments:
              description: >-
                The arguments to call the function with, as generated by the model in JSON format. Note that
                the model does not always generate valid JSON, and may hallucinate parameters not defined by
                your function schema. Validate the arguments in your code before calling your function.
              type: string
            name:
              description: The name of the function to call.
              type: string
          required:
            - name
            - arguments
          type: object
        role:
          description: The role of the author of this message.
          enum:
            - assistant
          type: string
        tool_calls:
          $ref: '#/components/schemas/ChatCompletionMessageToolCalls'
      required:
        - role
        - content
      type: object
    ChatCompletionRole:
      description: The role of the author of a message
      enum:
        - system
        - user
        - assistant
        - tool
        - function
      type: string
    ChatCompletionStreamOptions:
      default: null
      description: |
        Options for streaming response. Only set this when you set `stream: true`.
      nullable: true
      properties:
        include_usage:
          description: This field is unused
          type: boolean
      type: object
    ChatCompletionStreamResponseDelta:
      description: A chat completion delta generated by streamed model responses.
      properties:
        content:
          description: The contents of the chunk message.
          nullable: true
          type: string
        function_call:
          deprecated: true
          description: >-
            Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be
            called, as generated by the model.
          properties:
            arguments:
              description: >-
                The arguments to call the function with, as generated by the model in JSON format. Note that
                the model does not always generate valid JSON, and may hallucinate parameters not defined by
                your function schema. Validate the arguments in your code before calling your function.
              type: string
            name:
              description: The name of the function to call.
              type: string
          type: object
        role:
          description: The role of the author of this message.
          enum:
            - system
            - user
            - assistant
            - tool
          type: string
        tool_calls:
          items:
            $ref: '#/components/schemas/ChatCompletionMessageToolCallChunk'
          type: array
      type: object
    ChatCompletionTokenLogprob:
      properties:
        bytes: &ref_0
          description: >-
            A list of integers representing the UTF-8 bytes representation of the token. Useful in instances
            where characters are represented by multiple tokens and their byte representations must be
            combined to generate the correct text representation. Can be `null` if there is no bytes
            representation for the token.
          items:
            type: integer
          nullable: true
          type: array
        logprob: &ref_1
          description: >-
            The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the
            value `-9999.0` is used to signify that the token is very unlikely.
          type: number
        token: &ref_2
          description: The token.
          type: string
        top_logprobs:
          description: >-
            List of the most likely tokens and their log probability, at this token position. In rare cases,
            there may be fewer than the number of requested `top_logprobs` returned.
          items:
            properties:
              bytes: *ref_0
              logprob: *ref_1
              token: *ref_2
            required:
              - token
              - logprob
              - bytes
            type: object
          type: array
      required:
        - token
        - logprob
        - bytes
        - top_logprobs
      type: object
    ChatCompletionTool:
      properties:
        function:
          $ref: '#/components/schemas/FunctionObject'
        type:
          description: The type of the tool. Currently, only `function` is supported.
          enum:
            - function
          type: string
      required:
        - type
        - function
      type: object
    ChatCompletionToolChoiceOption:
      description: >
        Controls which (if any) tool is called by the model.

        `none` means the model will not call any tool and instead generates a message.

        `auto` means the model can pick between generating a message or calling one or more tools.

        `required` means the model must call one or more tools.

        Specifying a particular tool via `{"type": "function", "function": {"name": "my_function"}}` forces
        the model to call that tool.


        `none` is the default when no tools are present. `auto` is the default if tools are present.
      nullable: true
      oneOf:
        - description: >
            `none` means the model will not call any tool and instead generates a message. `auto` means the
            model can pick between generating a message or calling one or more tools.
          enum:
            - none
            - auto
            - required
          type: string
        - $ref: '#/components/schemas/ChatCompletionNamedToolChoice'
      x-groq-meta:
        validator: ChatCompletionToolChoiceOption
    CompletionUsage:
      description: Usage statistics for the completion request.
      properties:
        completion_time:
          description: Time spent generating tokens
          type: number
        completion_tokens:
          description: Number of tokens in the generated completion.
          type: integer
        prompt_time:
          description: Time spent processing input tokens
          type: number
        prompt_tokens:
          description: Number of tokens in the prompt.
          type: integer
        queue_time:
          description: Time the requests was spent queued
          type: number
        total_time:
          description: completion time and prompt time combined
          type: number
        total_tokens:
          description: Total number of tokens used in the request (prompt + completion).
          type: integer
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      type: object
    CreateChatCompletionRequest:
      additionalProperties: false
      properties:
        frequency_penalty:
          default: 0
          description: >-
            Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency
            in the text so far, decreasing the model's likelihood to repeat the same line verbatim.
          maximum: 2
          minimum: -2
          nullable: true
          type: number
        function_call:
          deprecated: true
          description: >
            Deprecated in favor of `tool_choice`.


            Controls which (if any) function is called by the model.

            `none` means the model will not call a function and instead generates a message.

            `auto` means the model can pick between generating a message or calling a function.

            Specifying a particular function via `{"name": "my_function"}` forces the model to call that
            function.


            `none` is the default when no functions are present. `auto` is the default if functions are
            present.
          nullable: true
          oneOf:
            - description: >
                `none` means the model will not call a function and instead generates a message. `auto` means
                the model can pick between generating a message or calling a function.
              enum:
                - none
                - auto
                - required
              type: string
            - $ref: '#/components/schemas/ChatCompletionFunctionCallOption'
        functions:
          deprecated: true
          description: |
            Deprecated in favor of `tools`.

            A list of functions the model may generate JSON inputs for.
          items:
            $ref: '#/components/schemas/ChatCompletionFunctions'
          maxItems: 128
          minItems: 0
          nullable: true
          type: array
        logit_bias:
          additionalProperties:
            type: integer
          default: null
          description: |
            This is not yet supported by any of our models.
            Modify the likelihood of specified tokens appearing in the completion.
          nullable: true
          type: object
        logprobs:
          default: false
          description: >
            This is not yet supported by any of our models.

            Whether to return log probabilities of the output tokens or not. If true, returns the log
            probabilities of each output token returned in the `content` of `message`.
          nullable: true
          type: boolean
        max_tokens:
          description: >
            The maximum number of tokens that can be generated in the chat completion. The total length of
            input tokens and generated tokens is limited by the model's context length.
          nullable: true
          type: integer
        messages:
          description: A list of messages comprising the conversation so far.
          items:
            $ref: '#/components/schemas/ChatCompletionRequestMessage'
          minItems: 1
          type: array
        model:
          anyOf:
            - type: string
            - enum:
                - gemma-7b-it
                - llama3-70b-8192
                - llama3-8b-8192
                - mixtral-8x7b-32768
              type: string
          description: >-
            ID of the model to use. For details on which models are compatible with the Chat API, see
            available [models](/docs/models)
        'n':
          default: 1
          description: >-
            How many chat completion choices to generate for each input message. Note that the current moment,
            only n=1 is supported. Other values will result in a 400 response.
          example: 1
          maximum: 1
          minimum: 1
          nullable: true
          type: integer
        parallel_tool_calls:
          default: true
          description: |
            Whether to enable parallel function calling during tool use.
          nullable: true
          type: boolean
        presence_penalty:
          default: 0
          description: >-
            Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in
            the text so far, increasing the model's likelihood to talk about new topics.
          maximum: 2
          minimum: -2
          nullable: true
          type: number
        response_format:
          description: >
            An object specifying the format that the model must output. 


            Setting to `{ "type": "json_object" }` enables JSON mode, which guarantees the message the model
            generates is valid JSON.


            **Important:** when using JSON mode, you **must** also instruct the model to produce JSON yourself
            via a system or user message.
          nullable: true
          properties:
            type:
              default: text
              description: Must be one of `text` or `json_object`.
              enum:
                - text
                - json_object
              example: json_object
              type: string
          type: object
        seed:
          description: >
            If specified, our system will make a best effort to sample deterministically, such that repeated
            requests with the same `seed` and parameters should return the same result.

            Determinism is not guaranteed, and you should refer to the `system_fingerprint` response parameter
            to monitor changes in the backend.
          nullable: true
          type: integer
        stop:
          default: null
          description: >
            Up to 4 sequences where the API will stop generating further tokens. The returned text will not
            contain the stop sequence.
          nullable: true
          oneOf:
            - example: |+

              nullable: true
              type: string
            - items:
                example: '["\n"]'
                type: string
              maxItems: 4
              minItems: 0
              type: array
        stream:
          default: false
          description: >
            If set, partial message deltas will be sent. Tokens will be sent as data-only [server-sent
            events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format)
            as they become available, with the stream terminated by a `data: [DONE]` message. [Example
            code](/docs/text-chat#streaming-a-chat-completion).
          nullable: true
          type: boolean
        temperature:
          default: 1
          description: >-
            What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output
            more random, while lower values like 0.2 will make it more focused and deterministic. We generally
            recommend altering this or top_p but not both
          example: 1
          maximum: 2
          minimum: 0
          nullable: true
          type: number
        tool_choice:
          $ref: '#/components/schemas/ChatCompletionToolChoiceOption'
        tools:
          description: >
            A list of tools the model may call. Currently, only functions are supported as a tool. Use this to
            provide a list of functions the model may generate JSON inputs for. A max of 128 functions are
            supported.
          items:
            $ref: '#/components/schemas/ChatCompletionTool'
          maxItems: 128
          nullable: true
          type: array
        top_logprobs:
          description: >
            This is not yet supported by any of our models.

            An integer between 0 and 20 specifying the number of most likely tokens to return at each token
            position, each with an associated log probability. `logprobs` must be set to `true` if this
            parameter is used.
          maximum: 20
          minimum: 0
          nullable: true
          type: integer
        top_p:
          default: 1
          description: >-
            An alternative to sampling with temperature, called nucleus sampling, where the model considers
            the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the
            top 10% probability mass are considered. We generally recommend altering this or temperature but
            not both.
          example: 1
          maximum: 1
          minimum: 0
          nullable: true
          type: number
        user:
          description: A unique identifier representing your end-user, which can help us monitor and detect abuse.
          nullable: true
          type: string
      required:
        - model
        - messages
      type: object
    CreateChatCompletionResponse:
      description: Represents a chat completion response returned by model, based on the provided input.
      properties:
        choices:
          description: A list of chat completion choices. Can be more than one if `n` is greater than 1.
          items:
            properties:
              finish_reason:
                description: >
                  The reason the model stopped generating tokens. This will be `stop` if the model hit a
                  natural stop point or a provided stop sequence,

                  `length` if the maximum number of tokens specified in the request was reached,

                  `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called
                  a function.
                enum:
                  - stop
                  - length
                  - tool_calls
                  - function_call
                type: string
              index:
                description: The index of the choice in the list of choices.
                type: integer
              logprobs: &ref_3
                description: Log probability information for the choice.
                nullable: true
                properties:
                  content:
                    description: A list of message content tokens with log probability information.
                    items:
                      $ref: '#/components/schemas/ChatCompletionTokenLogprob'
                    nullable: true
                    type: array
                required:
                  - content
                type: object
              message:
                $ref: '#/components/schemas/ChatCompletionResponseMessage'
            required:
              - finish_reason
              - index
              - message
              - logprobs
            type: object
          type: array
        created:
          description: The Unix timestamp (in seconds) of when the chat completion was created.
          type: integer
        id:
          description: A unique identifier for the chat completion.
          type: string
        model:
          description: The model used for the chat completion.
          type: string
        object:
          description: The object type, which is always `chat.completion`.
          enum:
            - chat.completion
          type: string
        system_fingerprint:
          description: >
            This fingerprint represents the backend configuration that the model runs with.


            Can be used in conjunction with the `seed` request parameter to understand when backend changes
            have been made that might impact determinism.
          type: string
        usage:
          $ref: '#/components/schemas/CompletionUsage'
      required:
        - choices
        - created
        - id
        - model
        - object
      type: object
    CreateChatCompletionStreamResponse:
      description: >-
        Represents a streamed chunk of a chat completion response returned by model, based on the provided
        input.
      properties:
        choices:
          description: |
            A list of chat completion choices. Can contain more than one elements if `n` is greater than 1.
          items:
            properties:
              delta:
                $ref: '#/components/schemas/ChatCompletionStreamResponseDelta'
              finish_reason:
                description: >
                  The reason the model stopped generating tokens. This will be `stop` if the model hit a
                  natural stop point or a provided stop sequence,

                  `length` if the maximum number of tokens specified in the request was reached,

                  `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called
                  a function.
                enum:
                  - stop
                  - length
                  - tool_calls
                  - content_filter
                  - function_call
                nullable: true
                type: string
              index:
                description: The index of the choice in the list of choices.
                type: integer
              logprobs: *ref_3
            required:
              - delta
              - finish_reason
              - index
            type: object
          type: array
        created:
          description: >-
            The Unix timestamp (in seconds) of when the chat completion was created. Each chunk has the same
            timestamp.
          type: integer
        id:
          description: A unique identifier for the chat completion. Each chunk has the same ID.
          type: string
        model:
          description: The model to generate the completion.
          type: string
        object:
          description: The object type, which is always `chat.completion.chunk`.
          enum:
            - chat.completion.chunk
          type: string
        system_fingerprint:
          description: >
            This fingerprint represents the backend configuration that the model runs with.

            Can be used in conjunction with the `seed` request parameter to understand when backend changes
            have been made that might impact determinism.
          type: string
        x_groq:
          $ref: '#/components/schemas/XGroq'
      required:
        - choices
        - created
        - id
        - model
        - object
      type: object
    CreateEmbeddingRequest:
      additionalProperties: false
      properties:
        encoding_format:
          default: float
          description: The format to return the embeddings in. Can only be `float` or `base64`.
          enum:
            - float
            - base64
          example: float
          type: string
        input:
          description: >
            Input text to embed, encoded as a string or array of tokens. To embed multiple inputs in a single
            request, pass an array of strings or array of token arrays. The input must not exceed the max
            input tokens for the model, cannot be an empty string, and any array must be 2048 dimensions or
            less.
          example: The quick brown fox jumped over the lazy dog
          oneOf:
            - default: ''
              description: The string that will be turned into an embedding.
              example: This is a test.
              title: string
              type: string
            - description: The array of strings that will be turned into an embeddings.
              items:
                default: ''
                example: "['This is a test.']"
                type: string
              maxItems: 2048
              minItems: 1
              title: array
              type: array
          x-groq-meta:
            validator: EmbeddingInput
        model:
          anyOf:
            - type: string
            - enum:
                - nomic-embed-text-v1_5
              type: string
          description: |
            ID of the model to use.
          example: nomic-embed-text-v1_5
        user:
          description: A unique identifier representing your end-user, which can help us monitor and detect abuse.
          nullable: true
          type: string
      required:
        - model
        - input
      type: object
    CreateEmbeddingResponse:
      properties:
        data:
          description: The list of embeddings generated by the model.
          items:
            $ref: '#/components/schemas/Embedding'
          type: array
        model:
          description: The name of the model used to generate the embedding.
          type: string
        object:
          description: The object type, which is always "list".
          enum:
            - list
          type: string
        usage:
          description: The usage information for the request.
          properties:
            prompt_tokens:
              description: The number of tokens used by the prompt.
              type: integer
            total_tokens:
              description: The total number of tokens used by the request.
              type: integer
          required:
            - prompt_tokens
            - total_tokens
          type: object
      required:
        - object
        - model
        - data
        - usage
      type: object
    CreateTranscriptionRequest:
      additionalProperties: false
      properties:
        file:
          description: >
            The audio file object (not file name) to transcribe, in one of these formats: flac, mp3, mp4,
            mpeg, mpga, m4a, ogg, wav, or webm.
          format: binary
          type: string
        language:
          anyOf:
            - type: string
            - enum:
                - en
                - zh
                - de
                - es
                - ru
                - ko
                - fr
                - ja
                - pt
                - tr
                - pl
                - ca
                - nl
                - ar
                - sv
                - it
                - id
                - hi
                - fi
                - vi
                - he
                - uk
                - el
                - ms
                - cs
                - ro
                - da
                - hu
                - ta
                - false
                - th
                - ur
                - hr
                - bg
                - lt
                - la
                - mi
                - ml
                - cy
                - sk
                - te
                - fa
                - lv
                - bn
                - sr
                - az
                - sl
                - kn
                - et
                - mk
                - br
                - eu
                - is
                - hy
                - ne
                - mn
                - bs
                - kk
                - sq
                - sw
                - gl
                - mr
                - pa
                - si
                - km
                - sn
                - yo
                - so
                - af
                - oc
                - ka
                - be
                - tg
                - sd
                - gu
                - am
                - yi
                - lo
                - uz
                - fo
                - ht
                - ps
                - tk
                - nn
                - mt
                - sa
                - lb
                - my
                - bo
                - tl
                - mg
                - as
                - tt
                - haw
                - ln
                - ha
                - ba
                - jv
                - su
                - yue
              type: string
          description: >
            The language of the input audio. Supplying the input language in
            [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) format will improve accuracy
            and latency.
        model:
          anyOf:
            - type: string
            - enum:
                - whisper-large-v3
              type: string
          description: |
            ID of the model to use. Only `whisper-large-v3` is currently available.
          example: whisper-large-v3
        prompt:
          description: >
            An optional text to guide the model's style or continue a previous audio segment. The
            [prompt](/docs/guides/speech-to-text/prompting) should match the audio language.
          type: string
        response_format:
          default: json
          description: |
            The format of the transcript output, in one of these options: `json`, `text`, or `verbose_json`.
          enum:
            - json
            - text
            - verbose_json
          type: string
        temperature:
          default: 0
          description: >
            The sampling temperature, between 0 and 1. Higher values like 0.8 will make the output more
            random, while lower values like 0.2 will make it more focused and deterministic. If set to 0, the
            model will use [log probability](https://en.wikipedia.org/wiki/Log_probability) to automatically
            increase the temperature until certain thresholds are hit.
          type: number
        timestamp_granularities:
          default:
            - segment
          description: >
            The timestamp granularities to populate for this transcription. `response_format` must be set
            `verbose_json` to use timestamp granularities. Either or both of these options are supported:
            `word`, or `segment`. Note: There is no additional latency for segment timestamps, but generating
            word timestamps incurs additional latency.
          items:
            enum:
              - word
              - segment
            type: string
          type: array
      required:
        - file
        - model
      type: object
    CreateTranscriptionResponseJson:
      description: Represents a transcription response returned by model, based on the provided input.
      properties:
        text:
          description: The transcribed text.
          type: string
      required:
        - text
      type: object
    CreateTranscriptionResponseVerboseJson:
      description: Represents a verbose json transcription response returned by model, based on the provided input.
      properties:
        duration:
          description: The duration of the input audio.
          type: string
        language:
          description: The language of the input audio.
          type: string
        segments:
          description: Segments of the transcribed text and their corresponding details.
          items:
            $ref: '#/components/schemas/TranscriptionSegment'
          type: array
        text:
          description: The transcribed text.
          type: string
        words:
          description: Extracted words and their corresponding timestamps.
          items:
            $ref: '#/components/schemas/TranscriptionWord'
          type: array
      required:
        - language
        - duration
        - text
      type: object
    CreateTranslationRequest:
      additionalProperties: false
      properties:
        file:
          description: >
            The audio file object (not file name) translate, in one of these formats: flac, mp3, mp4, mpeg,
            mpga, m4a, ogg, wav, or webm.
          format: binary
          type: string
        model:
          anyOf:
            - type: string
            - enum:
                - whisper-large-v3
              type: string
          description: |
            ID of the model to use. Only `whisper-large-v3` is currently available.
          example: whisper-1
        prompt:
          description: >
            An optional text to guide the model's style or continue a previous audio segment. The
            [prompt](/docs/guides/speech-to-text/prompting) should be in English.
          type: string
        response_format:
          default: json
          description: |
            The format of the transcript output, in one of these options: `json`, `text`, or `verbose_json`.
          enum:
            - json
            - text
            - verbose_json
          type: string
        temperature:
          default: 0
          description: >
            The sampling temperature, between 0 and 1. Higher values like 0.8 will make the output more
            random, while lower values like 0.2 will make it more focused and deterministic. If set to 0, the
            model will use [log probability](https://en.wikipedia.org/wiki/Log_probability) to automatically
            increase the temperature until certain thresholds are hit.
          type: number
      required:
        - file
        - model
      type: object
    CreateTranslationResponseJson:
      properties:
        text:
          type: string
      required:
        - text
      type: object
    CreateTranslationResponseVerboseJson:
      properties:
        duration:
          description: The duration of the input audio.
          type: string
        language:
          description: The language of the output translation (always `english`).
          type: string
        segments:
          description: Segments of the translated text and their corresponding details.
          items:
            $ref: '#/components/schemas/TranscriptionSegment'
          type: array
        text:
          description: The translated text.
          type: string
      required:
        - language
        - duration
        - text
      type: object
    DeleteModelResponse:
      properties:
        deleted:
          type: boolean
        id:
          type: string
        object:
          type: string
      required:
        - id
        - object
        - deleted
      type: object
    Embedding:
      description: |
        Represents an embedding vector returned by embedding endpoint.
      properties:
        embedding:
          oneOf:
            - description: >
                The embedding vector, which is a list of floats. The length of vector depends on the model as
                listed in the [embedding guide](/docs/guides/embeddings).
              items:
                type: number
              type: array
            - description: >
                The embedding vector, which is a base64 encoded string. The length of vector depends on the
                model as listed in the [embedding guide](/docs/guides/embeddings).
              type: string
        index:
          description: The index of the embedding in the list of embeddings.
          type: integer
        object:
          description: The object type, which is always "embedding".
          enum:
            - embedding
          type: string
      required:
        - index
        - object
        - embedding
      type: object
    Error:
      properties:
        code:
          nullable: true
          type: string
        message:
          nullable: false
          type: string
        param:
          nullable: true
          type: string
        type:
          nullable: false
          type: string
      required:
        - type
        - message
        - param
        - code
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
        - error
      type: object
    FunctionObject:
      properties:
        description:
          description: >-
            A description of what the function does, used by the model to choose when and how to call the
            function.
          type: string
        name:
          description: >-
            The name of the function to be called. Must be a-z, A-Z, 0-9, or contain underscores and dashes,
            with a maximum length of 64.
          type: string
        parameters:
          $ref: '#/components/schemas/FunctionParameters'
      required:
        - name
      type: object
    FunctionParameters:
      additionalProperties: true
      description: >-
        The parameters the functions accepts, described as a JSON Schema object. See the docs on [tool
        use](/docs/tool-use) for examples, and the [JSON Schema
        reference](https://json-schema.org/understanding-json-schema/) for documentation about the format. 


        Omitting `parameters` defines a function with an empty parameter list.
      type: object
    ListModelsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Model'
          type: array
        object:
          enum:
            - list
          type: string
      required:
        - object
        - data
      type: object
    Model:
      description: Describes an OpenAI model offering that can be used with the API.
      properties:
        created:
          description: The Unix timestamp (in seconds) when the model was created.
          type: integer
        id:
          description: The model identifier, which can be referenced in the API endpoints.
          type: string
        object:
          description: The object type, which is always "model".
          enum:
            - model
          type: string
        owned_by:
          description: The organization that owns the model.
          type: string
      required:
        - id
        - object
        - created
        - owned_by
      title: Model
    TranscriptionSegment:
      properties:
        avg_logprob:
          description: Average logprob of the segment. If the value is lower than -1, consider the logprobs failed.
          format: float
          type: number
        compression_ratio:
          description: >-
            Compression ratio of the segment. If the value is greater than 2.4, consider the compression
            failed.
          format: float
          type: number
        end:
          description: End time of the segment in seconds.
          format: float
          type: number
        id:
          description: Unique identifier of the segment.
          type: integer
        no_speech_prob:
          description: >-
            Probability of no speech in the segment. If the value is higher than 1.0 and the `avg_logprob` is
            below -1, consider this segment silent.
          format: float
          type: number
        seek:
          description: Seek offset of the segment.
          type: integer
        start:
          description: Start time of the segment in seconds.
          format: float
          type: number
        temperature:
          description: Temperature parameter used for generating the segment.
          format: float
          type: number
        text:
          description: Text content of the segment.
          type: string
        tokens:
          description: Array of token IDs for the text content.
          items:
            type: integer
          type: array
      required:
        - id
        - seek
        - start
        - end
        - text
        - tokens
        - temperature
        - avg_logprob
        - compression_ratio
        - no_speech_prob
      type: object
    TranscriptionWord:
      properties:
        end:
          description: End time of the word in seconds.
          format: float
          type: number
        start:
          description: Start time of the word in seconds.
          format: float
          type: number
        word:
          description: The text content of the word.
          type: string
      required:
        - word
        - start
        - end
      type: object
    XGroq:
      properties:
        error:
          description: An error string indicating why a stream was stopped early
          type: string
        id:
          description: |
            A groq request ID which can be used by to refer to a specific request to groq support 
            Only sent with the first chunk
          type: string
        usage:
          $ref: '#/components/schemas/CompletionUsage'
          description: Usage information for the stream. Only sent in the final chunk
      type: object
  securitySchemes:
    api_key:
      bearerFormat: apiKey
      scheme: bearer
      type: http
info:
  contact:
    email: support@groq.com
    name: Groq Support
  description: Specification of the Groq cloud API
  termsOfService: TBD
  title: GroqCloud API Swagger
  version: '2.0'
openapi: 3.0.1
paths:
  /openai/v1/audio/transcriptions:
    post:
      operationId: createTranscription
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTranscriptionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTranscriptionResponseJson'
          description: OK
      summary: Transcribes audio into the input language.
      tags:
        - Audio
      x-groq-metadata:
        examples:
          - request:
              js:
                path: library-transcription-default.js
              py:
                path: library-transcription-default.py
            response:
              path: library-transcription-response.json
            title: Default
        returns: Returns an audio transcription object
  /openai/v1/audio/translations:
    post:
      operationId: createTranslation
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTranslationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTranslationResponseJson'
            text/plain:
              schema:
                type: string
          description: OK
      summary: Translates audio into English.
      tags:
        - Audio
      x-groq-metadata:
        examples:
          - request:
              js:
                path: library-translation-default.js
              py:
                path: library-translation-default.py
            response:
              path: library-translation-response.json
            title: Default
        returns: Returns an audio translation object
  /openai/v1/chat/completions:
    post:
      operationId: createChatCompletion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
        description: The chat prompt and parameters
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatCompletionResponse'
          description: OK
      summary: Creates a model response for the given chat conversation.
      tags:
        - Chat
      x-groq-metadata:
        examples:
          - request:
              js:
                path: library-usage-default.js
              py:
                path: library-usage-default.py
            response:
              path: library-usage-response.json
            title: Default
        returns: >-
          Returns a [chat completion](/docs/api-reference#chat-create) object, or a streamed sequence of [chat
          completion chunk](/docs/api-reference#chat-create) objects if the request is streamed.
  /openai/v1/embeddings:
    post:
      operationId: createEmbedding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbeddingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEmbeddingResponse'
          description: OK
      summary: Creates an embedding vector representing the input text.
      tags:
        - Embeddings
  /openai/v1/models:
    get:
      description: get all available models
      operationId: listModels
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
          description: OK
      summary: List models
      tags:
        - Models
      x-groq-metadata:
        examples:
          - response:
              path: models-list-response.json
            title: Default
        returns: A list of models
  /openai/v1/models/{model}:
    delete:
      description: Delete a model
      operationId: deleteModel
      parameters:
        - description: The model to delete
          in: path
          name: model
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteModelResponse'
          description: OK
      summary: Delete model
      tags:
        - Models
    get:
      description: Get a specific model
      operationId: retrieveModel
      parameters:
        - description: The model to get
          in: path
          name: model
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
          description: OK
      summary: Get model
      tags:
        - Models
      x-groq-metadata:
        examples:
          - response:
              path: model-response.json
            title: Default
        returns: A model object
security:
  - api_key: []
servers:
  - url: https://api.groq.com
x-groq-metadata:
  groups:
    - description: null
      id: chat
      sections:
        - key: createChatCompletion
          path: create
          type: endpoint
      title: Chat
      type: endpoints
    - description: null
      id: audio
      sections:
        - key: createTranscription
          path: transcription
          type: endpoint
        - key: createTranslation
          path: translation
          type: endpoint
      title: Audio
      type: endpoints
    - description: null
      id: models
      sections:
        - key: listModels
          path: list
          type: endpoint
        - key: retrieveModel
          path: retrieve
          type: endpoint
      title: Models
      type: endpoints
